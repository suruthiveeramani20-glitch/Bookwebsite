<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest | Checkout</title>
    <link rel="stylesheet" href="corder.css">
</head>
<body>

<header class="navbar">
    <h2>📚 BookNest</h2>
    <a href="cart.html">← Back to Cart</a>
</header>

<main class="checkout-container">

    <h1>Checkout</h1>
    <p class="subtitle">Complete your details to place your order.</p>

    <div class="checkout-layout">

        <!-- Order Summary -->
        <section class="order-summary">
            <h2>Your Books</h2>

            <div id="orderBooks"></div>

            <div class="total-box">
                <p>Subtotal <span id="subtotal">₹0</span></p>
                <p>Delivery <span id="delivery">₹40</span></p>
                <h3>Total <span id="total">₹0</span></h3>
            </div>
        </section>

        <!-- Customer Form -->
        <section class="customer-form">
            <h2>Delivery Details</h2>

            <form id="orderForm">

                <label>Full Name</label>
                <input type="text" id="customerName"
                       placeholder="Enter your name" required>

                <label>Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter 10-digit phone number"
                       pattern="[0-9]{10}" required>

                <label>Delivery Address</label>
                <textarea id="address"
                          placeholder="Enter your full address"
                          required></textarea>

                <label>Payment Method</label>

                <div class="payment-option">
                    <input type="radio" name="payment"
                           value="UPI" id="upi" required>
                    <label for="upi">UPI</label>
                </div>

                <div class="payment-option">
                    <input type="radio" name="payment"
                           value="Debit/Credit Card" id="card">
                    <label for="card">Debit / Credit Card</label>
                </div>

                <div class="payment-option">
                    <input type="radio" name="payment"
                           value="Cash on Delivery" id="cod">
                    <label for="cod">Cash on Delivery</label>
                </div>

                <div id="upiBox" class="upi-box">
                    <label>UPI ID</label>
                    <input type="text" id="upiId"
                           placeholder="example@upi">
                </div>

                <button type="submit" id="placeOrderBtn">
                    Place Order
                </button>

            </form>

            <div id="confirmation" class="confirmation">
                <h2>🎉 Order Confirmed!</h2>
                <p>Your order has been placed successfully.</p>
                <p id="orderNumber"></p>

                

                <a href="index.html" class="continue-btn">
                    Continue Shopping
                </a>
            </div>

        </section>

    </div>

</main>

<script src="cart.js"></script>
<script src="corder.js"></script>

</body>
</html>
